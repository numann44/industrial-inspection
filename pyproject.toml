[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-inspection"
version = "0.1.0"
description = "From-scratch visual anomaly detection with auditable industrial data and evaluation"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6,<3", "numpy>=1.26,<3", "Pillow>=10,<13",
  "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
demo = ["streamlit==1.64.0"]
benchmark = ["torchvision==0.29.1", "timm==1.0.30", "tqdm>=4.62"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchcore = ["LICENSE", "NOTICE", "UPSTREAM.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
